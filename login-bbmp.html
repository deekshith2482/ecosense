<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoSense - BBMP Municipal Official Login</title>
  <meta name="description" content="Official authorization portal for Bruhat Bengaluru Mahanagara Palike (BBMP) Solid Waste Management Officers.">

  <link rel="stylesheet" href="styles/main.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: var(--radius-xl);
      max-width: 480px;
      width: 100%;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(2, 132, 199, 0.3);
      position: relative;
    }
    .bbmp-auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-full);
      border: 1px solid rgba(56, 189, 248, 0.4);
      margin-bottom: 1rem;
    }
    .quick-demo-login {
      background: rgba(4, 24, 18, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-top: 1.5rem;
    }
    .demo-officer-btn {
      width: 100%;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 0.6rem 0.85rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.5rem;
      transition: all 0.2s ease;
    }
    .demo-officer-btn:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div class="brand-icon" style="margin: 0 auto 0.75rem; width: 48px; height: 48px; font-size: 1.6rem; background: linear-gradient(135deg, #0284c7, #0369a1); border-color: #38bdf8;">🏛️</div>
        <span class="bbmp-auth-badge">🏛️ BBMP SWM COMMAND & CONTROL</span>
        <h2 style="font-size: 1.5rem; color: #f0fdf4;">BBMP Official Authorization</h2>
        <p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">
          Restricted access for Sanitation Wardens, Fleet Dispatchers & Super Admins.
        </p>
      </div>

      <form id="bbmp-login-form" onsubmit="handleBBMPLogin(event)">
        <div class="form-group">
          <label class="form-label">BBMP Officer Badge ID</label>
          <input type="text" id="bbmp-badge-input" class="form-input" placeholder="BBMP-SWM-XXXX" value="BBMP-SWM-8491" required />
        </div>

        <div class="form-group">
          <label class="form-label">Security Access PIN / Password</label>
          <input type="password" id="bbmp-pin-input" class="form-input" placeholder="••••••••" value="admin123" required />
        </div>

        <div class="form-group">
          <label class="form-label">Command Sector & Role</label>
          <select id="bbmp-role-select" class="form-select">
            <optgroup label="🌱 East Zone Command">
              <option value="Ward 112 Supervisor" selected>Ward 112 Indiranagar - Field Sanitation Warden</option>
              <option value="East Zone ZRO">East Zone (Shivajinagar/Ulsoor) - Zonal Health Officer</option>
            </optgroup>
            <optgroup label="🌳 South Zone Command">
              <option value="Ward 151 Supervisor">Ward 151 Koramangala - Triage Officer</option>
              <option value="South Zone ZRO">South Zone (Jayanagar/BTM) - Environmental Engineer</option>
            </optgroup>
            <optgroup label="🏢 West Zone Command">
              <option value="Ward 45 Supervisor">Ward 45 Malleshwaram - Solid Waste Superintendent</option>
              <option value="West Zone ZRO">West Zone (Rajajinagar/Vijayanagar) - Zonal Officer</option>
            </optgroup>
            <optgroup label="💻 Mahadevapura Tech Corridor Command">
              <option value="Ward 84 Supervisor">Ward 84 Whitefield/Bellandur - Incident Commander</option>
              <option value="Mahadevapura ZRO">Mahadevapura Zone - SWM Fleet Lead</option>
            </optgroup>
            <optgroup label="🚀 Bommanahalli & Electronic City Command">
              <option value="Ward 174 Supervisor">Ward 174 HSR Layout - Rapid Action Warden</option>
              <option value="Bommanahalli ZRO">Bommanahalli Zone - Operations Lead</option>
            </optgroup>
            <optgroup label="✈️ Yelahanka North Command">
              <option value="Ward 04 Supervisor">Ward 04 Yelahanka Satellite Town - Field Officer</option>
            </optgroup>
            <optgroup label="🏛️ RR Nagar Command">
              <option value="Ward 41 Supervisor">Ward 41 Rajarajeshwari Nagar - Supervisor</option>
            </optgroup>
            <optgroup label="🏭 Dasarahalli Industrial Command">
              <option value="Ward 35 Supervisor">Ward 35 Peenya Industrial - Duty Officer</option>
            </optgroup>
            <optgroup label="🏛️ City Central Command">
              <option value="Fleet Commander">Bangalore City - Heavy Compactor Fleet Commander</option>
              <option value="Chief Health Officer">BBMP Head Office - Chief SWM Health Officer (War Room)</option>
            </optgroup>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem; background: linear-gradient(135deg, #0284c7, #0369a1); border-color: #38bdf8;">
          🔐 Authorize BBMP Session
        </button>
      </form>

      <!-- Quick 1-Click Demo Profiles -->
      <div class="quick-demo-login">
        <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase;">
          ⚡ Instant 1-Click Officer Profiles:
        </div>
        <button type="button" class="demo-officer-btn" onclick="quickLoginBBMP('Officer S. Kumar', 'BBMP-SWM-8491', 'Ward 112 - Indiranagar', 'Field Supervisor')">
          <span>👮‍♂️ <b>S. Kumar</b> (Ward 112 Indiranagar)</span>
          <span style="color: #38bdf8;">Supervisor</span>
        </button>
        <button type="button" class="demo-officer-btn" onclick="quickLoginBBMP('Commander R. Jayaram', 'BBMP-FLEET-09', 'All Bangalore Zones', 'Fleet Commander')">
          <span>🚛 <b>R. Jayaram</b> (Compactor Fleet)</span>
          <span style="color: #38bdf8;">Commander</span>
        </button>
        <button type="button" class="demo-officer-btn" onclick="quickLoginBBMP('Dr. Anita Rao', 'BBMP-DIR-01', 'BBMP Central Command', 'Chief SWM Officer')">
          <span>👩‍💼 <b>Dr. Anita Rao</b> (Head Office)</span>
          <span style="color: #38bdf8;">Chief Officer</span>
        </button>
      </div>

      <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--border-subtle); padding-top: 1rem;">
        <span style="font-size: 0.8125rem; color: var(--text-tertiary);">Are you a Citizen / Society Resident?</span><br>
        <a href="login-citizen.html" style="font-weight: 700; color: var(--brand-400); font-size: 0.875rem; display: inline-block; margin-top: 0.35rem;">
          👤 Go to Citizen Reporting Portal &rarr;
        </a>
      </div>
    </div>
  </div>

  <script>
    function handleBBMPLogin(e) {
      e.preventDefault();
      const badgeId = document.getElementById("bbmp-badge-input").value;
      const role = document.getElementById("bbmp-role-select").value;

      const officer = {
        role: "bbmp",
        name: "Officer " + badgeId.split("-").pop(),
        badgeId: badgeId,
        dutyRole: role,
        loginTime: Date.now()
      };

      localStorage.setItem("ecosense_auth_user", JSON.stringify(officer));
      if (window.EcoSenseFirebase) {
        window.EcoSenseFirebase.syncUserProfile(officer);
      }
      window.location.href = "bbmp.html";
    }

    function quickLoginBBMP(name, badgeId, ward, dutyRole) {
      const officer = {
        role: "bbmp",
        name: name,
        badgeId: badgeId,
        ward: ward,
        dutyRole: dutyRole,
        loginTime: Date.now()
      };
      localStorage.setItem("ecosense_auth_user", JSON.stringify(officer));
      if (window.EcoSenseFirebase) {
        window.EcoSenseFirebase.syncUserProfile(officer);
      }
      window.location.href = "bbmp.html";
    }
  </script>

  <!-- Supabase Cloud PostgreSQL SDK & Service -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-service.js"></script>
</body>
</html>
